name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Os testes de integração sobem um MongoDB com Testcontainers (o runner já tem Docker).
      - name: Compilar e testar
        run: mvn -B verify
